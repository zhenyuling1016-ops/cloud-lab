<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 · 页面走丢了 | CloudLab</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  .nf { min-height: 70vh; display: grid; place-items: center; text-align: center; padding: 40px 24px; }
  .nf-code { font-size: clamp(72px, 18vw, 150px); font-weight: 800; line-height: 1;
             background: linear-gradient(100deg, #5b8cff, #37d6b0);
             -webkit-background-clip: text; background-clip: text; color: transparent; }
  .nf p { color: var(--muted); max-width: 520px; margin: 12px auto 28px; }
</style>
</head>
<body>
<main class="nf">
  <div>
    <div class="nf-code">404</div>
    <h1>这个路径上没有资源</h1>
    <p>
      GitHub Pages 找不到你请求的文件，于是返回了这个自定义 404 页面。
      这正好演示了静态托管环境下的错误处理方式：没有后端逻辑，一切靠预先放好的文件。
    </p>
    <a class="btn btn-primary" href="/">返回首页</a>
  </div>
</main>
</body>
</html>
